<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138808;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#grad2)"/>
  
  <!-- Chat bubble icon -->
  <g transform="translate(256, 256)">
    <!-- Main bubble -->
    <path d="M -80 -60 Q -100 -60 -100 -40 L -100 20 Q -100 40 -80 40 L 0 40 L 20 60 L 20 40 L 80 40 Q 100 40 100 20 L 100 -40 Q 100 -60 80 -60 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Message dots -->
    <circle cx="-40" cy="-10" r="12" fill="url(#grad1)"/>
    <circle cx="0" cy="-10" r="12" fill="url(#grad1)"/>
    <circle cx="40" cy="-10" r="12" fill="url(#grad1)"/>
  </g>
</svg>
